name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'server/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-db:
    name: Pre-Deploy Cloud DB Backup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Snapshot Live Production DB to db-state Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAP=$(curl -fsSL --max-time 8 "https://pritonn-production.up.railway.app/api/internal/db-snapshot" || true)
          if [ -n "$SNAP" ] && echo "$SNAP" | grep -q ":"; then
            mkdir -p /tmp/dbstate && cd /tmp/dbstate
            git init
            git config user.name "pritonn-db-bot"
            git config user.email "bot@pritonn.app"
            git checkout --orphan db-state
            printf "%s" "$SNAP" > db-snapshot.enc
            git add db-snapshot.enc
            git commit -m "chore(db): pre-deploy encrypted snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" db-state
            echo "Live DB snapshot saved to db-state!"
          else
            echo "Snapshot endpoint not yet active on old container; skipping."
          fi

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.16.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.16.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.16.0
          name: PRITONN v5.16.0 (Gifts & Stars, View-Once Media, Watch Together, Music Status, AI Noise Gate, Forum Topics, Quick Templates, Translator)
          body: |
            ## 🟣 PRITONN Messenger v5.16.0 — Глобальное обновление с подарками, секретными фото, кинозалом и AI-технологиями!
            
            ### Нововведения в версии 5.16.0:
            - 🎁 **Виртуальные подарки и Telegram Stars**: Витрина подарков в профиле пользователя, баланс Stars и каталог из 8 анимированных подарков (👑 Корона, 🚀 Ракета, 💎 Кристалл, 🏎️ Спорткар, 🎂 Торт, ⚡ Молния, 🌹 Роза, 🏆 Кубок) с личным пожеланием.
            - 🔒 **Секретные медиа «Просмотр 1 раз» (View Once)**: Отправка фото и видео с разовым просмотром и таймером самоуничтожения (5с, 10с, 30с) — медиа безвозвратно сгорает после просмотра!
            - 🎵 **Музыкальный статус («Слушает сейчас»)**: Анимированная эквалайзерная волна и название играющего трека рядом с именем пользователя в чатах и профиле в реальном времени.
            - 🎬 **Кинозал • Совместный просмотр видео (Watch Together)**: Синхронный просмотр YouTube и видеороликов участниками прямо во время звонка с синхронизацией воспроизведения и перемотки по сокетам.
            - 🎙️ **Студийное шумоподавление и виртуальные фоны веб-камеры**: Переключатель фильтрации внешних шумов и размытия фона / киберпанк-студии во время видео- и аудиозвонков.
            - 💬 **Темы / Форумы в группах (Topics)**: Вкладки разделов (# Все, # Общий, # Игры, # Музыка, # Вопросы) с фильтрацией сообщений и созданием новых тем в 1 клик.
            - ⏰ **Отложенная отправка («Отправить позже») и быстрые шаблоны ответов**: Всплывающее меню готовых фраз в 1 клик и отправка сообщений по расписанию.
            - 🌐 **Мгновенный переводчик сообщений**: Перевод любого сообщения на 10+ языков прямо из контекстного меню по правому клику мыши (ПКМ).
            - 🎨 **Новый ультра-стильный дизайн бокового меню и окон**: Стеклянные рамки кнопок, новая палитра тем (включая Золотой Люкс), перетаскивание чатов (Drag & Drop) в Архив и время прочтения сообщения («Прочитано в HH:mm»).
          files: PRITONN_v5.16.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
