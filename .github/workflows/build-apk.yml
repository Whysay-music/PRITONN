name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.11.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.11.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.11.0
          name: PRITONN v5.11.0 (Media Uploads, Round Video Notes, Android Screen Share, Voice Changer & Safe-Area Fix)
          body: |
            ## 🟣 PRITONN Messenger v5.11.0 — Большое обновление медиа, звонков и Android!
            
            ### Исправления и нововведения в версии 5.11.0:
            - 📎 **Отправка файлов, музыки, фото и видео**: Восстановлен нативный системный выбор файлов и галереи на Android (`BridgeWebChromeClient`) и добавлено автоматическое разрешение медиа-ссылок на всех платформах.
            - 🎥 **Видео-кружочки (Video Notes)**: Полная совместимость кодеков (`VP8/VP9/WebM/MP4`), переключение фронтальной/основной камеры и плавное воспроизведение.
            - 📹 **Стабильная камера в звонках**: Многоступенчатый захват камеры, переключение камер в звонке и резервный поток кадров без чёрного экрана.
            - 📱 **Поддержка безрамочных телефонов (Edge-to-Edge Android 15/16)**: Системные отступы `WindowInsets` (`systemBars`, `displayCutout`, `ime`) и адаптивная панель кнопок в звонках — все кнопки видны и легко нажимаются.
            - 📞 **Уведомления в чате о завершении звонка**: Автоматическое сообщение «Звонок завершён» с длительностью как для личных, так и для групповых звонков.
            - 🎭 **Реальная модуляция голоса (Voice Changer)**: Нативный Web Audio питч-шифтер (Бурундук, Демон/Бас), кольцевой модулятор (Робот), Эхо и Рация с функцией самопрослушивания и передачей в WebRTC-звонок.
            - 📲 **Демонстрация экрана с телефона Android**: Системная трансляция экрана смартфона через `MediaProjection` + Foreground Service в звонках и голосовых чатах.
            - 🖼️ **Свой фон чата из галереи**: Установка любого фото с телефона или ПК на фон чата (с автосжатием и синхронизацией).
          files: PRITONN_v5.11.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
