name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-db:
    name: Pre-Deploy Cloud DB Backup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Snapshot Live Production DB to db-state Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAP=$(curl -fsSL --max-time 8 "https://pritonn-production.up.railway.app/api/internal/db-snapshot" || true)
          if [ -n "$SNAP" ] && echo "$SNAP" | grep -q ":"; then
            mkdir -p /tmp/dbstate && cd /tmp/dbstate
            git init
            git config user.name "pritonn-db-bot"
            git config user.email "bot@pritonn.app"
            git checkout --orphan db-state
            printf "%s" "$SNAP" > db-snapshot.enc
            git add db-snapshot.enc
            git commit -m "chore(db): pre-deploy encrypted snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" db-state
            echo "Live DB snapshot saved to db-state!"
          else
            echo "Snapshot endpoint not yet active on old container; skipping."
          fi

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.13.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.13.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.13.0
          name: PRITONN v5.13.0 (Persistent User Database, Cross-Version Chat, Server Whisper Speech-to-Text & Settings Update Alerts)
          body: |
            ## 🟣 PRITONN Messenger v5.13.0 — Сохранение аккаунтов при обновлениях, Переписка между версиями, Точная расшифровка речи и Уведомление об обновлении в Настройках!
            
            ### Исправления и нововведения в версии 5.13.0:
            - 🛡️ **Вечное сохранение зарегистрированных пользователей и чатов**: Трёхуровневая система облачного бэкапа (`db-state` AES-256 + аддитивное объединение базы + авто-восстановление сессии `sync-account`) гарантирует, что аккаунты, чаты, сообщения, аватарки и голосовые никогда не удаляются при обновлениях сервера.
            - 🔄 **Полная совместимость переписки старых и новых версий**: Пользователи предыдущих версий и новой версии `v5.13.0` мгновенно обмениваются сообщениями, голосовыми и звонками в реальном времени без потерь при переподключении.
            - 🎙 **Точная серверная расшифровка русской речи (`→A`)**: Распознавание голосовых и аудиосообщений перенесено на серверный движок `Whisper-small` + `FFmpeg` (16 кГц с фильтрацией шума) — работает быстро и точно на Android, ПК и в РФ без загрузки тяжёлых моделей на телефон.
            - 🔔 **Оповещение о доступном обновлении в Настройках**: При выходе новой версии приходит системное уведомление, информационная панель с кнопкой **«Открыть Настройки»** и индикатор **`ОБНОВЛЕНИЕ`** на пункте меню «Настройки».
          files: PRITONN_v5.13.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
