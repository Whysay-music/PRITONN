name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.8.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.8.8.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.8.8
          name: PRITONN v5.8.8 (Stability, Modern Mobile UI & Calls Overhaul)
          body: |
            ## 🟣 PRITONN Messenger v5.8.8
            
            ### Что нового в версии 5.8.8:
            - 🛡️ **Защита от вылетов на Android**: Подключены настройки `largeHeap="true"`, аппаратное ускорение и автоматическая выдача системных разрешений для WebRTC камеры и микрофона.
            - 🔙 **Аппаратная кнопка «Назад» на Android**: Нажатие кнопки назад теперь возвращает к списку чатов или закрывает открытые окна, предотвращая случайное закрытие приложения.
            - 🎨 **Современный мобильный дизайн**: Стильная нижняя панель навигации (Чаты, Звонки, Истории, Настройки) и адаптивные отступы.
            - ☀️ **Полноценная поддержка светлой и тёмной темы**: Темы теперь работают и сохраняются на телефонах и ПК.
            - 🖼️ **100% загрузка аватарок**: Исправлена ошибка сохранения локальных путей — теперь аватарки гарантированно загружаются у всех пользователей с запасными векторными аватарами DiceBear.
            - 🎙️ **Голосовые чаты без фейковых слушателей**: Удалены все тестовые аккаунты (Alice, Bob, Charlie). Отображаются только реальные подключившиеся участники.
            - 📲 **Приглашения в голосовой чат**: Приглашённый пользователь отображается серым мигающим блоком до момента входа, после чего загорается ярким зелёным цветом.
            - 🔔 **Уведомление в чате о начале голосового звонка**: При создании голосового чата в группу отправляется интерактивное сообщение с кнопкой «Подключиться».
            - ⏱️ **Автосброс неотвеченного вызова**: Если собеседник не берёт трубку, звонок автоматически сбрасывается с пометкой «Абонент не отвечает».
          files: PRITONN_v5.8.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
