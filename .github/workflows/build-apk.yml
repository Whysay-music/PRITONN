name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.8.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.8.7.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.8.7
          name: PRITONN v5.8.7 (Call Improvements & UI Fixes)
          body: |
            ## 🟣 PRITONN Messenger v5.8.7
            
            ### Что нового в версии 5.8.7:
            - 🔊 **Изоляция звуков уведомлений**: Звук входящих сообщений воспроизводится только у участников конкретного диалога, чужие переписки больше не вызывают звуки.
            - 🖥️ **Выбор окна/экрана для демонстрации на ПК**: Полноценный селектор экранов и запущенных приложений с предпросмотром миниатюр.
            - 👥 **Приглашение друзей в звонок**: Кнопка «Пригласить» в окне звонка с поиском и быстрым вызовом участников.
            - ⚡ **Устранено мигание при наборе текста**: Оптимизировано сохранение черновиков, удалены резкие анимации перерисовки списка чатов.
            - 🎙️ **Надежность звука и WebRTC**: Добавлены запасные STUN-серверы и автоматический перезапуск аудиопотока при подключении.
            - 🌐 **Стабильность подключения к Railway**: Автоматическое подключение и дружелюбная обработка сетевых ошибок.
          files: PRITONN_v5.8.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
