name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.12.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.12.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.12.0
          name: PRITONN v5.12.0 (Voice Messages, Real Speech-to-Text, Private Drafts, Background Mode, Notifications & In-App Updater)
          body: |
            ## 🟣 PRITONN Messenger v5.12.0 — Голосовые сообщения, ИИ-распознавание речи, Фоновый режим, Уведомления и Автообновление!
            
            ### Исправления и нововведения в версии 5.12.0:
            - 📝 **Приватные черновики без утечек и повторов**: Неотправленный текст в поле ввода хранится строго локально только у автора (никогда не отображается у других участников чата) и гарантированно очищается после отправки — больше не появляется повторно при переключении чатов.
            - 🎙 **Реальная запись голосовых сообщений**: Захват голоса с микрофона (`MediaRecorder` + шумоподавление и живой индикатор уровня сигнала) и загрузка на сервер.
            - 🔊 **Полноценное воспроизведение голосовых сообщений**: Настоящий аудиоплеер (`<audio>`) со звуком, перемоткой по волне и ускорением `1x / 1.5x / 2x`.
            - 🧠 **Реальное распознавание речи (Voice-to-Text `→A`)**: Распознавание записанной русской речи нейросетью Whisper прямо из аудиофайла без заготовленных фраз.
            - 🔄 **Работа в фоновом режиме**: Нативная служба `KeepAliveService` (`remoteMessaging` + `WakeLock`/`WifiLock`) на Android и фоновый режим в системном трее без троттлинга на ПК (Windows).
            - 🔔 **Уведомления о сообщениях и звонках + тумблер отключения**: Системные уведомления на Android, Windows и в браузере с возможностью полностью выключить уведомления и звуки в **Настройках**.
            - 🚀 **Обновление программы прямо внутри приложения**: Автоматическая проверка новых версий и скачивание + установка обновления в один клик внутри Android APK и Windows PC!
          files: PRITONN_v5.12.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
