name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.8.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.8.6.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.8.6
          name: PRITONN v5.8.6 (Mobile Responsive & Video Calls)
          body: |
            ## 🟣 PRITONN Messenger & Social Platform v5.8.6
            
            ### Что нового в версии 5.8.6:
            - 📱 **Мобильный интерфейс**: На телефонах Android чаты открываются на весь экран, десктопные панели скрыты, добавлена кнопка возврата «Назад» к списку чатов.
            - 📹 **Видеокамера в звонках**: Полноценный WebRTC видеостриминг — теперь собеседники реально видят трансляцию с камеры друг друга с поддержкой PiP (картинка в картинке).
            - 🖥️ **Демонстрация экрана на ПК**: Включена системная поддержка трансляции экрана в приложении для Windows (Electron `desktopCapturer`). Собеседники на телефонах могут смотреть демонстрацию экрана в реальном времени.
            - 🌐 **Постоянный облачный сервер**: Интеграция с хостом Railway (`https://pritonn-production.up.railway.app`).
          files: PRITONN_v5.8.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
