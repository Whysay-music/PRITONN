name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'server/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-db:
    name: Pre-Deploy Cloud DB Backup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Snapshot Live Production DB to db-state Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAP=$(curl -fsSL --max-time 8 "https://pritonn-production.up.railway.app/api/internal/db-snapshot" || true)
          if [ -n "$SNAP" ] && echo "$SNAP" | grep -q ":"; then
            mkdir -p /tmp/dbstate && cd /tmp/dbstate
            git init
            git config user.name "pritonn-db-bot"
            git config user.email "bot@pritonn.app"
            git checkout --orphan db-state
            printf "%s" "$SNAP" > db-snapshot.enc
            git add db-snapshot.enc
            git commit -m "chore(db): pre-deploy encrypted snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" db-state
            echo "Live DB snapshot saved to db-state!"
          else
            echo "Snapshot endpoint not yet active on old container; skipping."
          fi

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.15.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.15.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.15.0
          name: PRITONN v5.15.0 (Framed Drawer UI, Drag & Drop Chats & Archive, Themes Engine, Read Receipt Timestamp)
          body: |
            ## 🟣 PRITONN Messenger v5.15.0 — Стильный дизайн бокового меню, Drag & Drop сортировка и архив, Темы оформления и Время прочтения сообщений!
            
            ### Нововведения в версии 5.15.0:
            - 🎨 **Новый стильный дизайн бокового меню**: Все кнопки оформлены в красивые аккуратные рамки с градиентными иконками, детальными описаниями и эффектом матового стекла (Glassmorphism).
            - 🗂 **Перетаскивание чатов (Drag & Drop) и удобный Архив**: Возможность свободно менять порядок диалогов в списке чатов перетаскиванием мыши / тачем, а также перетаскивать любые чаты в специальную светящуюся зону «В Архив».
            - 🌈 **Темы оформления (окна, обводки, градиенты)**: Добавлено 7 уникальных цветовых тем оформления (Классический Неон, Киберпанк Изумруд, Королевский Аметист, Закатный Рубин, Морская Бездна, OLED Обсидиан и Светлый Снег) с кастомными рамками, неоновыми обводками и переключателем в один клик.
            - 👁 **Точное время прочтения сообщения**: При нажатии правой кнопкой мыши (ПКМ) на сообщение отображается статус и точное время прочтения собеседником («Прочитано в HH:MM»).
          files: PRITONN_v5.15.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
