name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'server/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-db:
    name: Pre-Deploy Cloud DB Backup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Snapshot Live Production DB to db-state Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAP=$(curl -fsSL --max-time 8 "https://pritonn-production.up.railway.app/api/internal/db-snapshot" || true)
          if [ -n "$SNAP" ] && echo "$SNAP" | grep -q ":"; then
            mkdir -p /tmp/dbstate && cd /tmp/dbstate
            git init
            git config user.name "pritonn-db-bot"
            git config user.email "bot@pritonn.app"
            git checkout --orphan db-state
            printf "%s" "$SNAP" > db-snapshot.enc
            git add db-snapshot.enc
            git commit -m "chore(db): pre-deploy encrypted snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" db-state
            echo "Live DB snapshot saved to db-state!"
          else
            echo "Snapshot endpoint not yet active on old container; skipping."
          fi

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.17.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.17.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.17.0
          name: PRITONN v5.17.0 (Stories 24h, Profile Banners, Sticker Maker, Tap Game Mini App, Live Streams, Photo Editor)
          body: |
            ## 🟣 PRITONN Messenger v5.17.0 — Глобальное обновление: Истории 24ч, Конструктор стикеров, Кликер-игра, Трансляции и Редактор фото!
            
            ### 🌟 Что нового в версии 5.17.0:
            1. 📸 **PRITONN Истории (Stories)**:
               - Публикация фото/видео историй на 24 часа с подписями прямо с верхней панели чатов.
               - Полноэкранный плеер с таймером, сегментированными прогресс-барами, лайками, счетчиком просмотров и ответом в ЛС автору.
            2. 🎨 **Кастомизация профилей**:
               - Графические обложки (баннеры) в профиле пользователя.
               - Эмодзи-статусы (12 уникальных статусов) с отображением возле имени во всех чатах.
               - Коллекционные бейджи достижений («Основатель», «Участник», «Топ-Донатер») и видео-аватары.
            3. 🎮 **Конструктор стикеров & Mini App тапалка**:
               - Canvas-конструктор стикеров: вырезание стикеров из любого фото, регулировка толщины обводки (0-16px), добавление подписей и сохранение в личный стикерпак.
               - Официальная Mini App игра «PRITONN Tap & Farm»: золотая 3D монета, комбо-тапы, ранги (от Новичка до PRITONN Lord), бусты и синхронизация баланса.
            4. 📡 **Прямые трансляции в каналах (Live Streams)**:
               - Трансляция видео и звука хостом в реальном времени.
               - Зрительский режим с плавающими анимированными реакциями (❤️, 🔥, 👏, 🎉, 🚀), живым чатом и счетчиком зрителей.
            5. 🖼️ **Редактор фото перед отправкой**:
               - Canvas-редактор при прикреплении фото: рисование цветной кистью с настраиваемой толщиной, ластик, поворот на 90°, отмена действий Undo, фотофильтры (Ч/Б, Сепия, Киберпанк, Инверсия) и быстрая подпись.
            6. 💎 **Премиальный редизайн бокового меню и чатов**:
               - Стильные обрамления кнопок (framed buttons) с подсветкой и неоновыми акцентами.
               - Перетаскивание чатов (Drag & Drop) и мгновенный сброс в Архив.
               - Точное время прочтения сообщения собеседником в контекстном меню по правой кнопке мыши.
          files: PRITONN_v5.17.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
