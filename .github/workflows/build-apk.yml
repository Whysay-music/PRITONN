name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'server/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-db:
    name: Pre-Deploy Cloud DB Backup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Snapshot Live Production DB to db-state Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAP=$(curl -fsSL --max-time 8 "https://pritonn-production.up.railway.app/api/internal/db-snapshot" || true)
          if [ -n "$SNAP" ] && echo "$SNAP" | grep -q ":"; then
            mkdir -p /tmp/dbstate && cd /tmp/dbstate
            git init
            git config user.name "pritonn-db-bot"
            git config user.email "bot@pritonn.app"
            git checkout --orphan db-state
            printf "%s" "$SNAP" > db-snapshot.enc
            git add db-snapshot.enc
            git commit -m "chore(db): pre-deploy encrypted snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" db-state
            echo "Live DB snapshot saved to db-state!"
          else
            echo "Snapshot endpoint not yet active on old container; skipping."
          fi

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.14.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.14.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.14.0
          name: PRITONN v5.14.0 (Persistent Call Widget, Screen Share Fix, Call Notification Actions, Hold-to-Record & Modern UI)
          body: |
            ## 🟣 PRITONN Messenger v5.14.0 — Стабильные звонки и демонстрация экрана, Виджет звонка, Управление звонком из уведомлений, Запись удержанием и Новый стильный дизайн!
            
            ### Исправления и нововведения в версии 5.14.0:
            - 📞 **Постоянный виджет активного звонка и защита от вылетов**: Сворачивание звонка или нажатие «Назад» больше не выкидывает из звонка без виджета — плавающий остров звонка и верхняя панель доступны на всех экранах для мгновенного разворачивания.
            - 🖥 **Стабильная демонстрация экрана и отключение в 1 касание**: Включение демонстрации экрана не выкидывает в чаты; добавлена яркая кнопка быстрого отключения трансляции экрана прямо в звонке, в свёрнутом виджете и в уведомлении.
            - 🔔 **Управление звонком прямо из уведомлений**: Кнопки **«Принять»** и **«Отклонить»** для входящего вызова, а также **«Завершить звонок»** и **«Выкл. экран»** для активного звонка в шторке уведомлений Android и оверлее Windows ПК.
            - 🎙 **Переключение Микрофон / Кружок касанием и запись удержанием**: Одиночное нажатие на иконку микрофона переключает режим на видеокружок (и обратно), а зажатие кнопки сразу ведёт запись голосового сообщения или кружка.
            - ✨ **Обновлённый стильный интерфейс для телефона и ПК**: Современный стеклянный дизайн (Glassmorphism), обновлённые облачка сообщений, капсульные вкладки чатов, плавающая панель ввода и обновлённый экран звонка.
          files: PRITONN_v5.14.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
