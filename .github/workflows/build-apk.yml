name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'server/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-db:
    name: Pre-Deploy Cloud DB Backup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Snapshot Live Production DB to db-state Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAP=$(curl -fsSL --max-time 8 "https://pritonn-production.up.railway.app/api/internal/db-snapshot" || true)
          if [ -n "$SNAP" ] && echo "$SNAP" | grep -q ":"; then
            mkdir -p /tmp/dbstate && cd /tmp/dbstate
            git init
            git config user.name "pritonn-db-bot"
            git config user.email "bot@pritonn.app"
            git checkout --orphan db-state
            printf "%s" "$SNAP" > db-snapshot.enc
            git add db-snapshot.enc
            git commit -m "chore(db): pre-deploy encrypted snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" db-state
            echo "Live DB snapshot saved to db-state!"
          else
            echo "Snapshot endpoint not yet active on old container; skipping."
          fi

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.18.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.18.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.18.0
          name: PRITONN v5.18.0 (Floating Pill Input, Mobile Bottom Nav, PiP Call Pill, 2X Video Notes, Stories Thumbs)
          body: |
            ## 🟣 PRITONN Messenger v5.18.0 — Глобальное обновление дизайна, мобильной навигации и эргономики!
            
            ### 🌟 Что нового в версии 5.18.0:
            1. 💬 **Плавающая панель ввода («Floating Pill Bar»)**:
               - Современная строка ввода в стиле iOS 18 / Telegram Glassmorphism с мягким парением над чатом, полупрозрачным фоном и подсветкой.
            2. 📱 **Мобильная панель навигации (Mobile Bottom Nav)**:
               - Полноценная нижняя панель на смартфонах с вкладками: «Чаты» (с бейджем непрочитанных), «Истории», «Звонки» и «Меню».
            3. 📞 **Плавающий виджет активного звонка (Floating Call Pill)**:
               - При сворачивании звонка отображается компактная капсула в углу экрана с таймером, аватаркой, живым эквалайзером волны, быстрым выключением микрофона и завершением звонка в один клик.
            4. 📹 **Видео-кругляшки 2.0 с режимом 2X**:
               - Кнопка «2X» и поддержка двойного клика для мгновенного ускорения воспроизведения кругляшка в 2 раза.
            5. 📸 **Превью медиа в Историях (Stories)**:
               - В кружочках историй отображаются реальные мини-кадры фото с бейджем аватарки автора.
            6. 🔎 **Быстрые фильтры поиска**:
               - Чипсы фильтрации в поиске: «Все», «Медиа», «Файлы», «Голосовые», «Ссылки».
            7. ✍️ **Анимированный статус набора текста**:
               - Пульсирующие прыгающие точки «печатает...» в списке чатов при активности собеседника.
            8. 🪙 **Интерактивные чипсы монет и статуса в шапке Меню**:
               - Прямой доступ к балансу монет PRITONN Coins и смене эмодзи-статуса в 1 клик.
          files: PRITONN_v5.18.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
