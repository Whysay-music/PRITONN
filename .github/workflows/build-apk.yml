name: Build PRITONN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk PRITONN_v5.9.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRITONN-Android-APK
          path: PRITONN_v5.9.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v5.9.1
          name: PRITONN v5.9.1 (Stickers, GIFs, Mini-Games, App Lock, Wallpapers & Scheduled Messages)
          body: |
            ## 🟣 PRITONN Messenger v5.9.1 — Глобальное обновление функций!
            
            ### Что нового в версии 5.9.1:
            - 🐱 **Анимированные стикеры и поиск GIF**: Вкладка со стикерпаками (котята, Пепе, Telegram-утята) и категориями гифок (Огонь, Смех, Любовь, Танцы и др.).
            - 🎮 **Мини-игры прямо в чате**: Интерактивные дуэли в «Крестики-нолики» прямо внутри сообщения с другом в реальном времени!
            - 🔒 **Защита переписки (App Lock / PIN-код)**: Блокировка мессенджера 4-значным PIN-кодом и быстрая блокировка по иконке замочка.
            - 🖼️ **Свои обои для каждого чата**: Готовые пресеты (Космос, Закат, Изумруд, Неон) или установка любой картинки на фон диалога.
            - ⏰ **Отложенные сообщения**: Планирование отправки сообщений на выбранное время (через 15 минут, 1 час, завтра утром или точная дата).
            - ❤️ **Быстрая реакция по двойному клику**: Двойной клик на любое сообщение ставит сердечко.
            - ⏺️ **Запись аудио звонков**: Запись разговора в аудиофайл прямо из окна звонка.
            - 🎙️ **Интерактивная звуковая волна голосовых**: Перемотка войсов в любую секунду кликом по звуковой дорожке.
            - 💻 **Сворачивание в трей на Windows**: Приложение аккуратно прячется в системный трей возле часов с быстрым контекстным меню.
            - 📱 **Управление активными сессиями**: Просмотр подключённых устройств (ПК и телефон) в настройках.
          files: PRITONN_v5.9.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
